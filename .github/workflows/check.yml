# Builds the site and checks it against the Greenhouse package contract. No secrets.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Browser checks (test/header-width.test.mjs): Playwright and Chromium for this run only; the
      # package itself has no dependencies.
      - run: npm install --no-save playwright@1.65.1 && npx playwright install --with-deps chromium
      - run: npm test
