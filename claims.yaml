# Every public factual claim on the site, with its source, a verbatim quote and the date checked.
# Shape: greenhouse schemas/claims.schema.json (id, claim, where, source_url, quote, checked; nothing else).
# Pages cite a claim as {{c:<id>}}; the build fails on an unknown id and the tests fail on an unused one.
# `where` lists the routes that cite the claim; regenerate it with `npm run claims:where` (the tests
# fail when it drifts). Strict shape so scripts/claims.mjs reads it without a YAML library: every value
# is a double-quoted string, and `where` a one-line flow list of double-quoted strings.
# Comments above each entry: `# source_title: "..."` is the link text the build shows for the source
# (read by scripts/claims.mjs, not part of the schema); the other comment lines are the check notes.
# "Corrected" marks a claim reworded to match its source when re-checked.
# Quotes were re-fetched and matched in code on 2026-11-18.
# Published packages: a claim with id "published-<name>" whose source_url is the package's registry page
# (npmjs.com/package/<name>, hub.docker.com/r/<ns>/<repo>, github.com/<owner>/<repo>/pkgs/container/<name>, ...)
# lists that package as published. test/registry.test.mjs allows an install command only for a listed package
# and checks the registry has it. None is listed today.
